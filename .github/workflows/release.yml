name: Build and Release Assets

on: 
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  VERSION_TAG: ${{ github.ref_name }}

jobs:
  release:
    name: Create Draft GitHub Release
    runs-on: ubuntu-latest
    steps:
    - name: Get changelog.md
      uses: actions/checkout@v5
      with:
        sparse-checkout: CHANGELOG.md

    - name: Create Draft Release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: gh release create $VERSION_TAG --draft --title $VERSION_TAG --notes-file CHANGELOG.md

  build:
    name: Build and Upload ${{ matrix.os }}-${{ matrix.arch }} Binary to Release
    runs-on: ${{ matrix.runner }}
    needs: [release]
    env:
      OUTPUT_NAME: ${{ format('battleship-{0}-{1}', matrix.os, matrix.arch) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: win
            arch: x64
            runner: windows-latest

          - os: win
            arch: x86
            runner: windows-latest
          
          - os: win
            arch: arm64
            runner: windows-11-arm

          - os: linux
            arch: x64
            runner: ubuntu-24.04
          
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: src
      - uses: actions/setup-dotnet@v5.0.1
        with:
          dotnet-version: 9.0.305

      - name: Compile Binary
        shell: bash
        run: | 
          cd src
          dotnet publish -c Release \
          -v normal \
          --runtime ${{ matrix.os }}-${{ matrix.arch }} \
          -p:SelfContained=true \
          -p:PublishAot=true \
          -p:AssemblyName=$OUTPUT_NAME \
          -o ~

      - name: Upload Built App
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload $VERSION_TAG ~/$OUTPUT_NAME${{ (matrix.os == 'win' && '.exe' || '') }}
  Publish:
    name: Publish the GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Publish release by setting draft to false
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit $VERSION_TAG --draft=false